#
# Fix secret key name in flow Deployment: Crunchy PGO uses 'user' not 'username'.
# v2.3.0-pr removed psm/nsm containers from flow; only flow container remains.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow
spec:
  template:
    spec:
      containers:
        - name: flow
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: nico-site-pg-pguser-nico
