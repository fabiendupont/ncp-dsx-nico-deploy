name: Publish Helm Charts

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/publish-charts.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_PREFIX: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Add Helm repos
        run: |
          helm repo add temporal https://go.temporal.io/helm-charts
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm repo update

      - name: Build dependencies
        run: |
          helm dependency build helm/infra-cloud/
          helm dependency build helm/infra-site/

      - name: Package and push charts
        run: |
          for chart_dir in nvidia-infra-controller-prereqs infra-cloud infra-site; do
            helm package helm/$chart_dir/
          done
          for tgz in *.tgz; do
            helm push "$tgz" ${{ env.CHART_PREFIX }}
          done
